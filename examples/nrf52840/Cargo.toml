[package]
name = "adxl362-nrf52840-examples"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
adxl362 = { path = "../..", features = ["async", "defmt"] }

embassy-executor   = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-nrf        = { version = "0.11.0", features = ["nrf52840", "time-driver-rtc1", "gpiote", "defmt"] }
embassy-time       = { version = "0.5.1",  features = ["defmt", "defmt-timestamp-uptime"] }

embedded-hal       = "1.0"
embedded-hal-async = "1.0"
embedded-hal-bus   = { version = "0.3", features = ["async"] }

cortex-m    = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt       = "1"
defmt-rtt   = "1"
panic-probe = { version = "1", features = ["print-defmt"] }

[profile.release]
debug = 2
