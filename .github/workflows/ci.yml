name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --no-default-features --features blocking --all-targets -- -D warnings
      - run: cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --no-default-features --features blocking

  feature-combos:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - "--no-default-features --features blocking"
          - "--no-default-features --features async"
          - "--features float"
          - "--features defmt"
          - "--no-default-features --features blocking,float,defmt"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build ${{ matrix.features }}

  feature-combos-must-fail:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - features: "--no-default-features"
            expect: "enable either the `async` or `blocking` feature"
          - features: "--no-default-features --features async,blocking"
            expect: "mutually exclusive"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Confirm this combo is rejected by the intended compile_error! guard
        run: |
          if output=$(cargo build ${{ matrix.features }} 2>&1); then
            echo "expected a compile_error! for '${{ matrix.features }}' but the build succeeded"
            exit 1
          fi
          if ! grep -qF '${{ matrix.expect }}' <<< "$output"; then
            echo "build failed as expected, but not with the guard's error message"
            echo "expected to find: ${{ matrix.expect }}"
            echo "--- actual output ---"
            echo "$output"
            exit 1
          fi

  no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi
      - run: cargo build --no-default-features --features blocking --target thumbv7em-none-eabi
      - run: cargo build --target thumbv7em-none-eabi

  examples:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/nrf52840
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi
      - run: cargo build --bin basic --release
      - run: cargo build --bin motion_interrupt --release
      - run: cargo build --bin fifo --release
